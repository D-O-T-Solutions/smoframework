name: Docker Multi-Arch Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 0.0.5)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Multi-Arch
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  test-runtime:
    name: Runtime Test
    runs-on: ubuntu-22.04
    needs: build-and-push
    if: github.event_name != 'pull_request'
    steps:
      - name: Pull image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:0.0.5

      - name: Test version command
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:0.0.5 smo-node --version

      - name: Test help command
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:0.0.5 smo-node --help

  compose-test:
    name: Docker Compose 3-Node Test
    runs-on: ubuntu-22.04
    needs: build-and-push
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start 3-node mesh
        run: |
          docker compose -f docker-compose.yml up -d

      - name: Wait for nodes to be healthy
        run: |
          timeout 120 bash -c '
            while ! docker compose ps node-a | grep -q "healthy"; do sleep 3; done
            while ! docker compose ps node-b | grep -q "healthy"; do sleep 3; done
            while ! docker compose ps node-c | grep -q "healthy"; do sleep 3; done
          '

      - name: Verify mesh connectivity
        run: |
          docker compose exec -T node-a smo-node --pubkey --data /var/lib/smo
          docker compose exec -T node-b smo-node --pubkey --data /var/lib/smo
          docker compose exec -T node-c smo-node --pubkey --data /var/lib/smo

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v