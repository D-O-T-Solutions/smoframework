# OpenVPN server config cho SMO mesh deployment
# Copy to /etc/openvpn/server.conf on cloud VPS

port 1194
proto udp
dev tun

# Certificate — generated by easy-rsa or deployed manually
ca ca.crt
cert server.crt
key server.key
dh dh.pem

# Network
server 10.8.0.0 255.255.255.0
ifconfig-pool-persist ipp.txt
push "route 10.8.0.0 255.255.255.0"
push "redirect-gateway def1 bypass-dhcp"

# DNS
push "dhcp-option DNS 1.1.1.1"
push "dhcp-option DNS 8.8.8.8"

# Security
tls-version-min 1.2
cipher AES-256-GCM
auth SHA256
tls-crypt ta.key

keepalive 10 60

# Persistent
persist-key
persist-tun

# Status logging
status /var/log/openvpn/status.log
log-append /var/log/openvpn/server.log
verb 3
mute 20

# Client isolation — SMO nodes cần talk lẫn nhau
# KHÔNG dùng client-to-client vì sẽ dùng SMO protocol
# Nhưng vẫn cần cho mesh traffic
client-to-client
duplicate-cn

# Only allow SMO nodes
max-clients 10
