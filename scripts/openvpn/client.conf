# OpenVPN client config cho SMO mesh node
# Copy to /etc/openvpn/client.conf trên local machine

client
dev tun
proto udp

# Thay <CLOUD_PUBLIC_IP> bằng IP thật của VPS
remote <CLOUD_PUBLIC_IP> 1194

# Certificate — generated by easy-rsa or deployed
ca ca.crt
cert client.crt
key client.key
tls-crypt ta.key

# Security
tls-version-min 1.2
cipher AES-256-GCM
auth SHA256

# Persistent
persist-key
persist-tun

# Route only SMO subnet (không redirect all traffic)
route 10.8.0.0 255.255.255.0

# Status
status /var/log/openvpn/client.log
verb 3
mute 20

# Keep connection alive
keepalive 10 60
remote-random
reneg-sec 0
