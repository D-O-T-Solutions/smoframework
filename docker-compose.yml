# Docker Compose for 3-node SMO mesh (dev/test)
# Usage: docker compose -f docker-compose.yml up -d

services:
  node-a:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    image: ghcr.io/smoframework/smo-node:0.0.5
    hostname: node-a
    container_name: smo-node-a
    networks:
      smo-mesh:
        ipv4_address: 172.20.0.10
    ports:
      - "27777:7777"
      - "29090:9090"
    environment:
      SMO_NODE_NAME: "soc-hn-01"
      SMO_NODE_ROLE: "Authority"
      SMO_NODE_PORT: "7777"
      SMO_ADMIN_PORT: "9090"
      SMO_MESH_NAME: "SOC-Production"
      SMO_IS_AUTHORITY: "true"
    volumes:
      - smo-data-a:/var/lib/smo
      - smo-etc-a:/etc/smo
    cap_add:
      - NET_ADMIN
    command: ["--daemon", "--port", "7777", "--admin-port", "9090", "--data", "/var/lib/smo", "--name", "soc-hn-01"]
    healthcheck:
      test: ["CMD", "smo-node", "--pubkey", "--data", "/var/lib/smo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  node-b:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    image: ghcr.io/smoframework/smo-node:0.0.5
    hostname: node-b
    container_name: smo-node-b
    networks:
      smo-mesh:
        ipv4_address: 172.20.0.11
    ports:
      - "27778:7777"
      - "29091:9090"
    environment:
      SMO_NODE_NAME: "backup-02"
      SMO_NODE_ROLE: "Member"
      SMO_NODE_PORT: "7777"
      SMO_ADMIN_PORT: "9090"
      SMO_MESH_NAME: "SOC-Production"
      SMO_SEED_NODE: "node-a:7777"
    volumes:
      - smo-data-b:/var/lib/smo
      - smo-etc-b:/etc/smo
    cap_add:
      - NET_ADMIN
    command: ["--daemon", "--port", "7777", "--admin-port", "9090", "--data", "/var/lib/smo", "--name", "backup-02", "--seed", "node-a:7777"]
    depends_on:
      node-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "smo-node", "--pubkey", "--data", "/var/lib/smo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  node-c:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    image: ghcr.io/smoframework/smo-node:0.0.5
    hostname: node-c
    container_name: smo-node-c
    networks:
      smo-mesh:
        ipv4_address: 172.20.0.12
    ports:
      - "27779:7777"
      - "29092:9090"
    environment:
      SMO_NODE_NAME: "vpn-gateway"
      SMO_NODE_ROLE: "Contributor"
      SMO_NODE_PORT: "7777"
      SMO_ADMIN_PORT: "9090"
      SMO_MESH_NAME: "SOC-Production"
      SMO_SEED_NODE: "node-a:7777"
    volumes:
      - smo-data-c:/var/lib/smo
      - smo-etc-c:/etc/smo
    cap_add:
      - NET_ADMIN
    command: ["--daemon", "--port", "7777", "--admin-port", "9090", "--data", "/var/lib/smo", "--name", "vpn-gateway", "--seed", "node-a:7777"]
    depends_on:
      node-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "smo-node", "--pubkey", "--data", "/var/lib/smo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  smo-mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  smo-data-a:
  smo-data-b:
  smo-data-c:
  smo-etc-a:
  smo-etc-b:
  smo-etc-c: